[unix_http_server]
file=/tmp/devcontainer-supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/devcontainer-supervisord.log
pidfile=/tmp/devcontainer-supervisord.pid
childlogdir=/tmp/devcontainer-supervisor
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/devcontainer-supervisor.sock

[program:rojo]
directory=%(ENV_WORKSPACE_DIR)s
command=/usr/local/bin/rojo serve
user=bun
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/devcontainer-supervisor/rojo.log
stderr_logfile=/tmp/devcontainer-supervisor/rojo.err.log
environment=HOME="/home/bun",USER="bun",WORKSPACE_DIR="%(ENV_WORKSPACE_DIR)s"

[program:rbxtsc-watch]
directory=%(ENV_WORKSPACE_DIR)s
command=/usr/local/bin/bun run watch
user=bun
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/devcontainer-supervisor/rbxtsc-watch.log
stderr_logfile=/tmp/devcontainer-supervisor/rbxtsc-watch.err.log
environment=HOME="/home/bun",USER="bun",WORKSPACE_DIR="%(ENV_WORKSPACE_DIR)s"
